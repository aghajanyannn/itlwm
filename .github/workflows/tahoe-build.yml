name: Build Tahoe AWDL VIF Test 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MacKernelSDK
        run: |
          git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Apply AWDL VIF Test 2
        run: |
          python3 <<'PY'
          from pathlib import Path

          hpp = Path("AirportItlwm/AirportItlwmV2.hpp")
          cpp = Path("AirportItlwm/AirportItlwmV2.cpp")

          h = hpp.read_text()
          c = cpp.read_text()

          # ---------- HEADER ----------
          marker = "    void publishRuntimeCounters(void);\n"

          add = r'''
              // AWDL VIF Test #2
              static IOReturn awdlVifCreateGated(
                  OSObject *, void *, void *, void *, void *);

              void tryAwdlVifCreate(void);

              IO80211VirtualInterface *fTestAwdlVif;
              uint32_t fTestAwdlTicks;
              bool fTestAwdlAttempted;
          '''

          if "AWDL VIF Test #2" not in h:
              if marker not in h:
                  raise SystemExit("header marker missing")
              h = h.replace(marker, marker + add, 1)

          # ---------- INIT ----------
          init_marker = "bool AirportItlwm::init(OSDictionary *properties)\n{"

          # Add initialization just after init begins.
          init_find = """bool AirportItlwm::init(OSDictionary *properties)
          {
          """

          init_replace = """bool AirportItlwm::init(OSDictionary *properties)
          {
          #if __IO80211_TARGET >= __MAC_26_0
              fTestAwdlVif = NULL;
              fTestAwdlTicks = 0;
              fTestAwdlAttempted = false;
          #endif
          """

          if "fTestAwdlAttempted = false" not in c:
              if init_find not in c:
                  raise SystemExit("init marker missing")
              c = c.replace(init_find, init_replace, 1)

          # ---------- IMPLEMENTATION ----------
          impl_marker = "#if __IO80211_TARGET >= __MAC_26_0\n// Tahoe consumed"

          impl = r'''
          #if __IO80211_TARGET >= __MAC_26_0

          static uint32_t gAwdlTestAttempt = 0;
          static uint32_t gAwdlTestAttachOK = 0;
          static uint32_t gAwdlTestEnableOK = 0;
          static uint32_t gAwdlTestRole = 0;
          static uint32_t gAwdlTestHasObject = 0;
          static int32_t  gAwdlTestEnableRet = 0;

          IOReturn
          AirportItlwm::awdlVifCreateGated(
              OSObject *owner,
              void *,
              void *,
              void *,
              void *)
          {
              AirportItlwm *self =
                  OSDynamicCast(AirportItlwm, owner);

              if (!self)
                  return kIOReturnBadArgument;

              if (self->fTestAwdlAttempted)
                  return kIOReturnSuccess;

              self->fTestAwdlAttempted = true;
              gAwdlTestAttempt++;

              IOEthernetAddress hw;
              bzero(&hw, sizeof(hw));

              if (self->getHardwareAddress(&hw) != kIOReturnSuccess)
                  return kIOReturnError;

              ether_addr mac;
              memcpy(&mac, hw.bytes, 6);

              // Locally administered, unicast address.
              mac.octet[0] |= 0x02;
              mac.octet[0] &= 0xFE;
              mac.octet[5] ^= 0x40;

              IO80211VirtualInterface *vif = NULL;

              bool attached =
                  self->super::attachVirtualInterface(
                      &vif,
                      &mac,
                      APPLE80211_VIF_AWDL,
                      true
                  );

              if (!attached || vif == NULL)
                  return kIOReturnError;

              gAwdlTestAttachOK++;
              gAwdlTestHasObject = 1;
              gAwdlTestRole = vif->getInterfaceRole();

              self->fTestAwdlVif = vif;

              SInt32 er =
                  self->super::enableVirtualInterface(vif);

              gAwdlTestEnableRet = er;

              if (er == 0) {
                  gAwdlTestEnableOK++;

                  vif->setEnabledBySystem(true);
                  vif->setLinkState(
                      kIO80211NetworkLinkUp,
                      0
                  );

                  vif->postMessage(
                      APPLE80211_M_LINK_CHANGED
                  );
              }

              return er;
          }


          void
          AirportItlwm::tryAwdlVifCreate(void)
          {
              if (fTestAwdlAttempted)
                  return;

              struct ieee80211com *ic =
                  fHalService->get80211Controller();

              // Wait for normal infrastructure Wi-Fi first.
              if (ic->ic_state != IEEE80211_S_RUN)
                  return;

              // 10 watchdog ticks ~= 10 seconds connected.
              if (++fTestAwdlTicks < 10)
                  return;

              _fCommandGate->runAction(
                  awdlVifCreateGated
              );
          }

          #endif

          '''

          if "AirportItlwm::awdlVifCreateGated" not in c:
              if impl_marker not in c:
                  raise SystemExit("implementation marker missing")
              c = c.replace(
                  impl_marker,
                  impl + impl_marker,
                  1
              )

          # ---------- WATCHDOG ----------
          wd_find = """    publishRuntimeCounters();
          #endif
              watchdogTimer->setTimeoutMS(kWatchDogTimerPeriod);
          """

          wd_replace = """    publishRuntimeCounters();
              tryAwdlVifCreate();
          #endif
              watchdogTimer->setTimeoutMS(kWatchDogTimerPeriod);
          """

          if "tryAwdlVifCreate();" not in c:
              if wd_find not in c:
                  raise SystemExit("watchdog marker missing")
              c = c.replace(wd_find, wd_replace, 1)

          # ---------- COUNTERS ----------
          pub_find = """void AirportItlwm::publishRuntimeCounters()
          {
          """

          pub_replace = """void AirportItlwm::publishRuntimeCounters()
          {
              setProperty("ItlwmAwdlAttempt",
                          (UInt64)gAwdlTestAttempt, 32);
              setProperty("ItlwmAwdlAttachOK",
                          (UInt64)gAwdlTestAttachOK, 32);
              setProperty("ItlwmAwdlEnableOK",
                          (UInt64)gAwdlTestEnableOK, 32);
              setProperty("ItlwmAwdlRole",
                          (UInt64)gAwdlTestRole, 32);
              setProperty("ItlwmAwdlHasObject",
                          (UInt64)gAwdlTestHasObject, 32);
              setProperty("ItlwmAwdlEnableRet",
                          (UInt64)(uint32_t)gAwdlTestEnableRet, 32);
          """

          if '"ItlwmAwdlAttempt"' not in c:
              if pub_find not in c:
                  raise SystemExit("publish marker missing")
              c = c.replace(pub_find, pub_replace, 1)

          hpp.write_text(h)
          cpp.write_text(c)

          print("AWDL VIF Test #2 applied")
          PY

      - name: Build AirportItlwm Tahoe
        run: |
          xcodebuild \
            -jobs 8 \
            -target "AirportItlwm-Tahoe" \
            -configuration Release \
            build

      - name: Package
        run: |
          KEXT="$(find build -path '*Tahoe*' -name 'AirportItlwm.kext' | head -1)"

          if [ -z "$KEXT" ]; then
            echo "Tahoe kext not found"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$KEXT" \
            AirportItlwm-Tahoe-AWDL-VIF-TEST2.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Tahoe-AWDL-VIF-TEST2
          path: AirportItlwm-Tahoe-AWDL-VIF-TEST2.zip
