name: Build Tahoe AirportItlwm

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MacKernelSDK
        run: |
          rm -rf MacKernelSDK
          git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Apply AWDL VIF Test #2
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          hpp = Path("AirportItlwm/AirportItlwmV2.hpp")
          cpp = Path("AirportItlwm/AirportItlwmV2.cpp")

          h = hpp.read_text()
          c = cpp.read_text()

          # ============================================================
          # HEADER PATCH
          # ============================================================

          h_marker = """    virtual IOReturn setLinkState(IO80211NetworkLinkState state, int reason) override;
          """

          h_insert = """    virtual IOReturn setLinkState(IO80211NetworkLinkState state, int reason) override;

              // AWDL VIF Test #2
              static IOReturn awdlVifCreateGated(
                  OSObject *, void *, void *, void *, void *);

              IOReturn doAwdlVifCreate(void);
              void tryAwdlVifCreate(void);

              IO80211VirtualInterface *fTestAwdlVif;
              uint32_t fTestAwdlTicks;
              bool fTestAwdlAttempted;
          """

          if "awdlVifCreateGated" not in h:
              if h_marker not in h:
                  raise SystemExit("Header marker not found")

              h = h.replace(
                  h_marker,
                  h_insert,
                  1
              )

              hpp.write_text(h)

          # ============================================================
          # CPP — AWDL VIRTUAL INTERFACE IMPLEMENTATION
          # ============================================================

          c_marker = """void AirportItlwm::dataLinkLayerAttachComplete(IO80211Interface *interface)
          {
          """

          c_insert = r"""#if __IO80211_TARGET >= __MAC_26_0

          static uint32_t gAwdlTestAttempt = 0;
          static uint32_t gAwdlTestAttachOK = 0;
          static uint32_t gAwdlTestEnableOK = 0;
          static uint32_t gAwdlTestRole = 0;
          static uint32_t gAwdlTestHasObject = 0;
          static int32_t  gAwdlTestEnableRet = 0;

          IOReturn
          AirportItlwm::awdlVifCreateGated(
              OSObject *owner,
              void *,
              void *,
              void *,
              void *)
          {
              AirportItlwm *self =
                  OSDynamicCast(AirportItlwm, owner);

              if (!self)
                  return kIOReturnBadArgument;

              return self->doAwdlVifCreate();
          }

          IOReturn
          AirportItlwm::doAwdlVifCreate(void)
          {
              if (fTestAwdlAttempted)
                  return kIOReturnSuccess;

              fTestAwdlAttempted = true;
              gAwdlTestAttempt++;

              IOEthernetAddress hw;
              bzero(&hw, sizeof(hw));

              if (getHardwareAddress(&hw) != kIOReturnSuccess)
                  return kIOReturnError;

              ether_addr mac;
              memcpy(&mac, hw.bytes, 6);

              // Create a locally-administered unicast MAC
              // derived from the physical Wi-Fi MAC.
              mac.octet[0] |= 0x02;
              mac.octet[0] &= 0xFE;
              mac.octet[5] ^= 0x40;

              IO80211VirtualInterface *vif = NULL;

              bool attached =
                  super::attachVirtualInterface(
                      &vif,
                      &mac,
                      APPLE80211_VIF_AWDL,
                      true
                  );

              if (!attached || vif == NULL)
                  return kIOReturnError;

              gAwdlTestAttachOK++;
              gAwdlTestHasObject = 1;
              gAwdlTestRole =
                  vif->getInterfaceRole();

              fTestAwdlVif = vif;

              SInt32 er =
                  super::enableVirtualInterface(vif);

              gAwdlTestEnableRet = er;

              if (er == 0) {
                  gAwdlTestEnableOK++;

                  vif->setEnabledBySystem(true);

                  vif->setLinkState(
                      kIO80211NetworkLinkUp,
                      0
                  );

                  vif->postMessage(
                      APPLE80211_M_LINK_CHANGED
                  );
              }

              return er;
          }

          void
          AirportItlwm::tryAwdlVifCreate(void)
          {
              if (fTestAwdlAttempted)
                  return;

              struct ieee80211com *ic =
                  fHalService->get80211Controller();

              if (ic == NULL)
                  return;

              if (ic->ic_state != IEEE80211_S_RUN)
                  return;

              // Give the normal Wi-Fi interface several poll cycles
              // after association before attempting the AWDL VIF.
              if (++fTestAwdlTicks < 10)
                  return;

              _fCommandGate->runAction(
                  awdlVifCreateGated
              );
          }

          #endif

          """

          if "gAwdlTestAttempt" not in c:
              if c_marker not in c:
                  raise SystemExit("CPP marker not found")

              c = c.replace(
                  c_marker,
                  c_insert + c_marker,
                  1
              )

          # ============================================================
          # INITIALIZE TEST STATE
          # ============================================================

          init_marker = """    fPendingIEData = NULL;
              fPendingIELen = 0;
          """

          init_insert = """    fPendingIEData = NULL;
              fPendingIELen = 0;

              fTestAwdlVif = NULL;
              fTestAwdlTicks = 0;
              fTestAwdlAttempted = false;
          """

          if "fTestAwdlAttempted = false" not in c:
              if init_marker not in c:
                  raise SystemExit("Init marker not found")

              c = c.replace(
                  init_marker,
                  init_insert,
                  1
              )

          # ============================================================
          # CALL AWDL TEST FROM EXISTING POLL PATH
          # ============================================================

          poll_marker = """if_handle_delayed_autojoin(ifp);
          """

          poll_insert = """if_handle_delayed_autojoin(ifp);

              // AWDL VIF Test #2
              tryAwdlVifCreate();
          """

          if "tryAwdlVifCreate();" not in c:
              if poll_marker not in c:
                  raise SystemExit("Poll marker not found")

              c = c.replace(
                  poll_marker,
                  poll_insert,
                  1
              )

          cpp.write_text(c)

          print("AWDL VIF Test #2 patch applied successfully.")
          PY

          echo "===== PATCHED SYMBOLS ====="

          grep -n \
            "awdlVifCreateGated\|doAwdlVifCreate\|tryAwdlVifCreate\|gAwdlTest\|fTestAwdl" \
            AirportItlwm/AirportItlwmV2.hpp \
            AirportItlwm/AirportItlwmV2.cpp

      - name: Build AirportItlwm Tahoe
        run: |
          set -o pipefail

          xcodebuild \
            -project itlwm.xcodeproj \
            -scheme AirportItlwm-Tahoe \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Show build tail
        if: always()
        run: |
          echo "===== LAST 250 LINES ====="
          tail -250 build.log || true

          echo ""
          echo "===== COMPILER ERRORS ====="
          grep -n "error:" build.log | tail -80 || true

      - name: Find built kext
        if: success()
        run: |
          echo "===== BUILT AIRPORTITLWM ====="
          find build -name "AirportItlwm.kext" -print

      - name: Package
        if: success()
        run: |
          KEXT="$(find build -path '*Tahoe*' -name 'AirportItlwm.kext' | head -1)"

          if [ -z "$KEXT" ]; then
            echo "Tahoe AirportItlwm.kext not found"
            exit 1
          fi

          echo "Packaging:"
          echo "$KEXT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$KEXT" \
            AirportItlwm-Tahoe-AWDL-VIF-Test2.zip

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Tahoe-AWDL-VIF-Test2
          path: AirportItlwm-Tahoe-AWDL-VIF-Test2.zip
