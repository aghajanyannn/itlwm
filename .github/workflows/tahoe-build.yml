name: Build Tahoe AirportItlwm

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MacKernelSDK
        run: |
          rm -rf MacKernelSDK
          git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Apply AWDL VIF Test 3
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          hpp = Path("AirportItlwm/AirportItlwmV2.hpp")
          cpp = Path("AirportItlwm/AirportItlwmV2.cpp")

          h = hpp.read_text()
          c = cpp.read_text()

          # ============================================================
          # HEADER
          # ============================================================

          if "awdlVifCreateGated" not in h:
              marker = (
                  "    virtual IOReturn "
                  "getHardwareAddress(IOEthernetAddress* addrP) override;\n"
              )

              if marker not in h:
                  raise SystemExit(
                      "ERROR: getHardwareAddress header anchor not found"
                  )

              addition = marker + r"""
          #if __IO80211_TARGET >= __MAC_26_0
              // Experimental Tahoe AWDL virtual-interface test.
              static IOReturn awdlVifCreateGated(
                  OSObject *owner,
                  void *arg0,
                  void *arg1,
                  void *arg2,
                  void *arg3
              );

              IOReturn doAwdlVifCreate(void);
              void tryAwdlVifCreate(void);

              IO80211VirtualInterface *fTestAwdlVif;
              uint32_t fTestAwdlTicks;
              bool fTestAwdlAttempted;
          #endif
          """

              # Remove indentation intentionally present only
              # to keep the GitHub Actions YAML valid.
              addition = addition.replace(
                  "\n          ",
                  "\n"
              )

              h = h.replace(marker, addition, 1)

          # ============================================================
          # CPP IMPLEMENTATION
          # ============================================================

          if "gAwdlTestAttempt" not in c:
              marker = "IOCommandGate *_fCommandGate;\n"

              if marker not in c:
                  raise SystemExit(
                      "ERROR: _fCommandGate CPP anchor not found"
                  )

              implementation = r"""

          #if __IO80211_TARGET >= __MAC_26_0

          static uint32_t gAwdlTestAttempt = 0;
          static uint32_t gAwdlTestAttachOK = 0;
          static uint32_t gAwdlTestEnableOK = 0;
          static uint32_t gAwdlTestRole = 0;
          static uint32_t gAwdlTestHasObject = 0;
          static int32_t  gAwdlTestEnableRet = 0;

          IOReturn
          AirportItlwm::awdlVifCreateGated(
              OSObject *owner,
              void *,
              void *,
              void *,
              void *)
          {
              AirportItlwm *self =
                  OSDynamicCast(AirportItlwm, owner);

              if (self == NULL)
                  return kIOReturnBadArgument;

              return self->doAwdlVifCreate();
          }

          IOReturn
          AirportItlwm::doAwdlVifCreate(void)
          {
              if (fTestAwdlAttempted)
                  return kIOReturnSuccess;

              fTestAwdlAttempted = true;
              gAwdlTestAttempt++;

              if (fHalService == NULL)
                  return kIOReturnNotReady;

              IOEthernetAddress hw;
              bzero(&hw, sizeof(hw));

              IOReturn hwret =
                  getHardwareAddress(&hw);

              if (hwret != kIOReturnSuccess)
                  return hwret;

              struct ether_addr mac;
              bzero(&mac, sizeof(mac));

              memcpy(
                  mac.octet,
                  hw.bytes,
                  sizeof(mac.octet)
              );

              // Locally administered unicast MAC.
              mac.octet[0] |= 0x02;
              mac.octet[0] &= 0xFE;
              mac.octet[5] ^= 0x40;

              IO80211VirtualInterface *vif = NULL;

              bool attached =
                  super::attachVirtualInterface(
                      &vif,
                      &mac,
                      APPLE80211_VIF_AWDL,
                      true
                  );

              if (!attached || vif == NULL) {
                  gAwdlTestEnableRet =
                      (int32_t)kIOReturnError;

                  return kIOReturnError;
              }

              fTestAwdlVif = vif;

              gAwdlTestAttachOK++;
              gAwdlTestHasObject = 1;

              gAwdlTestRole =
                  (uint32_t)vif->getInterfaceRole();

              SInt32 er =
                  enableVirtualInterface(vif);

              gAwdlTestEnableRet = er;

              if (er == 0)
                  gAwdlTestEnableOK++;

              return er;
          }

          void
          AirportItlwm::tryAwdlVifCreate(void)
          {
              if (fTestAwdlAttempted)
                  return;

              if (fHalService == NULL)
                  return;

              if (_fCommandGate == NULL)
                  return;

              struct ieee80211com *ic =
                  fHalService->get80211Controller();

              if (ic == NULL)
                  return;

              // Only test once normal Wi-Fi is connected.
              if (ic->ic_state != IEEE80211_S_RUN) {
                  fTestAwdlTicks = 0;
                  return;
              }

              // watchdogAction is roughly 1 Hz.
              if (++fTestAwdlTicks < 5)
                  return;

              _fCommandGate->runAction(
                  (IOCommandGate::Action)awdlVifCreateGated,
                  NULL,
                  NULL,
                  NULL,
                  NULL
              );
          }

          #endif
          """

              implementation = implementation.replace(
                  "\n          ",
                  "\n"
              )

              c = c.replace(
                  marker,
                  marker + implementation,
                  1
              )

          # ============================================================
          # INITIALIZE TEST STATE
          # ============================================================

          if "fTestAwdlAttempted = false;" not in c:
              pattern = re.compile(
                  r"(bool\s+AirportItlwm::init\s*"
                  r"\(\s*OSDictionary\s*\*\s*properties\s*\)"
                  r"\s*\{\s*)"
              )

              match = pattern.search(c)

              if not match:
                  raise SystemExit(
                      "ERROR: AirportItlwm::init anchor not found"
                  )

              init_code = r"""
          #if __IO80211_TARGET >= __MAC_26_0
              fTestAwdlVif = NULL;
              fTestAwdlTicks = 0;
              fTestAwdlAttempted = false;
          #endif

          """

              init_code = init_code.replace(
                  "\n          ",
                  "\n"
              )

              c = (
                  c[:match.end()]
                  + init_code
                  + c[match.end():]
              )

          # ============================================================
          # WATCHDOG CALL
          # ============================================================

          if "AWDL_VIF_TEST_WATCHDOG_CALL" not in c:
              pattern = re.compile(
                  r"(void\s+AirportItlwm::watchdogAction\s*"
                  r"\(\s*IOTimerEventSource\s*\*\s*timer\s*\)"
                  r"\s*\{\s*)"
              )

              match = pattern.search(c)

              if not match:
                  raise SystemExit(
                      "ERROR: watchdogAction anchor not found"
                  )

              watchdog_code = r"""
          #if __IO80211_TARGET >= __MAC_26_0
              // AWDL_VIF_TEST_WATCHDOG_CALL
              tryAwdlVifCreate();
          #endif

          """

              watchdog_code = watchdog_code.replace(
                  "\n          ",
                  "\n"
              )

              c = (
                  c[:match.end()]
                  + watchdog_code
                  + c[match.end():]
              )

          hpp.write_text(h)
          cpp.write_text(c)

          print("======================================")
          print("AWDL VIF Test 3 applied successfully")
          print("======================================")
          PY

          echo ""
          echo "===== HEADER SYMBOLS ====="
          grep -n \
            "awdlVifCreateGated\|doAwdlVifCreate\|tryAwdlVifCreate\|fTestAwdl" \
            AirportItlwm/AirportItlwmV2.hpp

          echo ""
          echo "===== CPP SYMBOLS ====="
          grep -n \
            "gAwdlTest\|awdlVifCreateGated\|doAwdlVifCreate\|tryAwdlVifCreate\|AWDL_VIF_TEST" \
            AirportItlwm/AirportItlwmV2.cpp

      - name: Build AirportItlwm Tahoe
        run: |
          set -o pipefail

          xcodebuild \
            -jobs 8 \
            -target "AirportItlwm-Tahoe" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Show build errors
        if: always()
        run: |
          echo ""
          echo "===== COMPILER ERRORS ====="
          grep -n "error:" build.log | tail -100 || true

          echo ""
          echo "===== WARNINGS ====="
          grep -n "warning:" build.log | tail -50 || true

          echo ""
          echo "===== BUILD LOG TAIL ====="
          tail -200 build.log || true

      - name: Find built kext
        if: success()
        run: |
          echo "===== BUILT AIRPORTITLWM ====="
          find . -type d -name "AirportItlwm.kext" -print

      - name: Package
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          KEXT="$(
            find . \
              -type d \
              -path '*Release*' \
              -name 'AirportItlwm.kext' \
              | head -1
          )"

          if [ -z "$KEXT" ]; then
            KEXT="$(
              find . \
                -type d \
                -name 'AirportItlwm.kext' \
                | head -1
            )"
          fi

          if [ -z "$KEXT" ]; then
            echo "AirportItlwm.kext not found"
            exit 1
          fi

          echo "Packaging:"
          echo "$KEXT"

          rm -f AirportItlwm-Tahoe-AWDL-VIF-Test3.zip

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$KEXT" \
            AirportItlwm-Tahoe-AWDL-VIF-Test3.zip

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Tahoe-AWDL-VIF-Test3
          path: AirportItlwm-Tahoe-AWDL-VIF-Test3.zip
          if-no-files-found: error
